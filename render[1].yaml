# TEST deployment: free database expires after 30 days; use fake data only.
services:
  - type: web
    name: classic-agent-backend
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: classic-agent-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: ""
databases:
  - name: classic-agent-db
    region: virginia
    plan: free
    ipAllowList: []
